<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Reading room</title>
    <link rel="stylesheet" href="/style.css">
    <script type="module" src="/app.js"></script>
  </head>
  <body>
    <header class="masthead"><a class="brand" href="/">Reading room<span aria-hidden="true"> ↗</span></a><span class="edition">A little space for good ideas</span></header>
    <main>
      <section class="introduction" aria-labelledby="page-title">
        <p class="eyebrow">YOUR PERSONAL SHELF</p>
        <h1 id="page-title">For a quieter moment.</h1>
        <p class="lede">Essays, stories, and things worth coming back to.</p>
      </section>
      <section class="shelf" aria-labelledby="shelf-title">
        <div class="section-heading"><h2 id="shelf-title">Saved for later</h2><span id="item-count"></span></div>
        <p id="list-status" role="status">Opening your shelf…</p>
        <ul id="items" class="items"></ul>
      </section>
    </main>
    <footer>GOOD WORDS. YOUR OWN PACE.</footer>
  </body>
</html>
