name: Validate

on:
  push:
    branches: [main, "work/**"]
  pull_request:

permissions:
  contents: read

jobs:
  workflow-lint:
    name: GitHub Actions / actionlint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Check workflow semantics with pinned actionlint
        shell: bash
        run: |
          set -euo pipefail
          actionlint_dir="${RUNNER_TEMP}/actionlint"
          mkdir -p "$actionlint_dir"
          archive="$actionlint_dir/actionlint.tar.gz"
          curl --fail --location --retry 3 \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz \
            --output "$archive"
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  $archive" | sha256sum --check
          tar -xzf "$archive" -C "$actionlint_dir" actionlint
          "$actionlint_dir/actionlint" -color

  skill-quality:
    name: SkillEvaluator / static skill checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: .github/requirements/skillevaluator.txt
      - name: Install pinned SkillEvaluator
        run: python -m pip install --requirement .github/requirements/skillevaluator.txt
      - name: Verify the skill gate rejects defective fixtures
        run: python -m unittest discover -s scripts -p test_skillevaluator.py
      - name: Check every bundled skill
        run: sh scripts/check-skills.sh plugins/deepwright/skills "$RUNNER_TEMP/skillevaluator-reports"
      - name: Check repository-local maintainer skill
        run: sh scripts/check-skills.sh .agents/skills/deepwright-maintain "$RUNNER_TEMP/skillevaluator-reports/repository-maintainer"
      - name: Upload skill reports
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: skillevaluator-reports
          path: ${{ runner.temp }}/skillevaluator-reports/
          if-no-files-found: error
          retention-days: 14

  codex-compatibility:
    name: ${{ matrix.os }} / Node ${{ matrix.node }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            node: 20.19.0
          - os: macos-14
            node: 24
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: plugins/deepwright/skills/deepwright/scripts/package-lock.json
      - name: Install helper dependencies
        run: npm ci --prefix plugins/deepwright/skills/deepwright/scripts
      - name: Audit helper dependencies
        run: npm audit --prefix plugins/deepwright/skills/deepwright/scripts --package-lock-only --audit-level=high
      - name: Build and test helpers
        run: npm run test:tools
      - name: Test skill evaluation receipts
        run: npm run test:evals
      - name: Test run evidence and resume allowances
        run: npm run test:runs
      - name: Verify generated bundles and launchers
        shell: bash
        run: |
          git diff --exit-code -- plugins/deepwright/skills/deepwright/scripts/dist
          bash -n plugins/deepwright/skills/deepwright/scripts/worktree-audit.sh
          sh -n plugins/deepwright/skills/deepwright/scripts/deepwright
          sh -n plugins/deepwright/skills/deepwright/scripts/orch/orch
          sh -n plugins/deepwright/skills/deepwright/scripts/watch-pr/watch-pr
      - name: Validate Codex package
        run: npm run validate
      - name: Verify package and CLI metadata contracts
        run: npm run test:contracts
      - name: Install pinned portable hosts
        run: npm install --prefix "$RUNNER_TEMP/portable-hosts" --no-save bun@1.4.0 @oh-my-pi/pi-coding-agent@18.1.16 @anthropic-ai/claude-code@2.1.263
      - name: Verify Claude and OMP marketplace lifecycle and skill activation policy
        shell: bash
        run: |
          export PATH="$RUNNER_TEMP/portable-hosts/node_modules/.bin:$PATH"
          bun scripts/verify-portable-hosts.mjs "$RUNNER_TEMP/portable-hosts/node_modules/@oh-my-pi/pi-coding-agent"
      - name: Install Codex CLI
        run: npm install --global @openai/codex
      - name: Smoke-test plugin installation
        run: |
          codex plugin marketplace add "$GITHUB_WORKSPACE" --json
          codex plugin list --available --json > available.json
          node -e 'const v=require("./available.json"); const a=Array.isArray(v)?v:[...(v.available??[]),...(v.installed??[])]; if(!a.some(x=>x.name==="deepwright"||x.pluginId==="deepwright@deepwright")) process.exit(1)'
          codex plugin add deepwright@deepwright --json
          codex plugin list --json > installed.json
          node -e 'const v=require("./installed.json"); const a=Array.isArray(v)?v:v.installed??[]; if(!a.some(x=>x.name==="deepwright"||x.pluginId==="deepwright@deepwright")) process.exit(1)'

  release:
    name: Release manifest version
    needs: [codex-compatibility, skill-quality, workflow-lint]
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Publish version release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          version="$(node -e '
            const fs = require("node:fs");
            const value = JSON.parse(
              fs.readFileSync(
                "plugins/deepwright/.codex-plugin/plugin.json",
                "utf8"
              )
            ).version;
            if (typeof value !== "string") process.exit(1);
            process.stdout.write(value);
          ')"

          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Manifest version is not stable semver: $version"
            exit 1
          fi

          tag="v${version}"
          release_error="${RUNNER_TEMP}/release-get.err"

          if release_state="$(gh api \
            "repos/${GITHUB_REPOSITORY}/releases/tags/${tag}" \
            --jq '"\(.draft) \(.prerelease)"' \
            2>"$release_error")"; then
            if [[ "$release_state" != "false false" ]]; then
              echo "::error::${tag} exists, but is draft or prerelease."
              exit 1
            fi
            echo "Published release ${tag} already exists; skipping."
            exit 0
          elif ! grep -Fq "(HTTP 404)" "$release_error"; then
            cat "$release_error" >&2
            exit 1
          fi

          notes="${RUNNER_TEMP}/deepwright-${tag}-notes.md"
          VERSION="$version" NOTES="$notes" node <<'NODE'
          const fs = require("node:fs");
          const lines = fs.readFileSync("CHANGELOG.md", "utf8")
            .replace(/\r\n/g, "\n").split("\n");
          const prefix = `## ${process.env.VERSION}`;
          const matches = lines
            .map((line, index) =>
              line === prefix || line.startsWith(`${prefix} `) ? index : -1)
            .filter(index => index >= 0);
          if (matches.length !== 1) {
            throw new Error(`Expected exactly one ${prefix} changelog section`);
          }
          const start = matches[0] + 1;
          let end = lines.findIndex((line, index) =>
            index >= start && line.startsWith("## "));
          if (end < 0) end = lines.length;
          const body = lines.slice(start, end).join("\n").trim();
          if (!body) throw new Error(`${prefix} changelog section is empty`);
          fs.writeFileSync(process.env.NOTES, `${body}\n`);
          NODE

          tag_error="${RUNNER_TEMP}/tag-get.err"
          if tag_object="$(gh api \
            "repos/${GITHUB_REPOSITORY}/git/ref/tags/${tag}" \
            --jq '.object.type + ":" + .object.sha' \
            2>"$tag_error")"; then
            :
          elif grep -Fq "(HTTP 404)" "$tag_error"; then
            gh api --method POST \
              "repos/${GITHUB_REPOSITORY}/git/refs" \
              -f ref="refs/tags/${tag}" \
              -f sha="${GITHUB_SHA}" >/dev/null || true
            tag_object="$(gh api \
              "repos/${GITHUB_REPOSITORY}/git/ref/tags/${tag}" \
              --jq '.object.type + ":" + .object.sha')"
          else
            cat "$tag_error" >&2
            exit 1
          fi

          if [[ "$tag_object" != "commit:${GITHUB_SHA}" ]]; then
            echo "::error::${tag} already targets ${tag_object}, not commit:${GITHUB_SHA}."
            exit 1
          fi

          if ! gh release create "$tag" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "Deepwright ${tag}" \
            --notes-file "$notes"; then
            release_state="$(gh api \
              "repos/${GITHUB_REPOSITORY}/releases/tags/${tag}" \
              --jq '"\(.draft) \(.prerelease)"')" || exit 1
            [[ "$release_state" == "false false" ]] || exit 1
            echo "Published release ${tag} was created concurrently."
          fi
